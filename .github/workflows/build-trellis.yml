name: build-trellis.yml

# Builds SeasonRealms/trellis.cpp for Windows x64 with the GGML revision that the
# fork itself pins in thirdparty/ggml (.gitmodules -> pwilkin/ggml, branch
# "trellis"). The submodule commit recorded in the trellis.cpp tree is the
# version pin: this workflow never re-points or patches it, so the GGML ABI in
# the produced binaries is exactly the one trellis.cpp is developed against.
# Freezing the build = passing a commit/tag in trellis_ref; the resolved
# trellis.cpp and GGML commits are printed, written to the artifact manifest and
# recorded in the job summary so a later run can be reproduced commit-for-commit.
# An artifact is therefore the pair (trellis_ref, this repository's commit): the
# one source file this repository contributes - the C ABI shim - is taken from
# the checkout of the commit that triggered the run, and that commit is recorded
# next to the trellis one.
#
# Season3D ships two entry points into the same code, and the package carries
# both:
#
#   trellis-cli.exe / trellis-server.exe - the worker lane. trellis_core is linked
#     statically into them; ggml is built as shared libraries (ggml.dll,
#     ggml-base.dll, plus ggml-cpu.dll / ggml-cuda.dll when the backend produces
#     them). A worker resolves its imports from the directory of the loading
#     .exe, so that whole DLL set ships in the package next to the executables; a
#     package without them dies inside the loader with 0xC0000135
#     (STATUS_DLL_NOT_FOUND) before main() ever runs.
#
#   trellis.dll - the thin C ABI lane. trellis.cpp exposes no C header and its
#     core is STATIC, so this is our own single export: trellis_run_argv(), the
#     same parse_args()+trellis_run() pair the cli runs, compiled by a target
#     appended to trellis.cpp's own CMake project (see native/trellis_capi.cpp in
#     this repository; native/apply-capi-lane.ps1 is the script that copies it in
#     and appends the target, and a local build runs the same script). It is what
#     lets Season3D present one library-shaped API on every platform - a dll here,
#     .so/.dylib/.a elsewhere - while the worker stays available for crash
#     isolation and hard timeouts.
#
# The CUDA runtime DLLs are shipped alongside when the cuda backend is selected.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "CMake build type"
        required: true
        type: choice
        default: "Release"
        options:
          - Release
          - Debug
      trellis_ref:
        description: "SeasonRealms/trellis.cpp tag / branch / commit (a commit or tag freezes the build)"
        required: true
        default: "main"
      backend:
        description: "GGML backend compiled into trellis"
        required: true
        type: choice
        default: "cuda"
        options:
          - cuda
          - cpu
      cuda_version:
        description: "CUDA Toolkit version (cuda backend only), aligned with SeasonGGML / SeasonTTS"
        required: false
        default: "12.8.1"
      cuda_architectures:
        description: "CUDA architectures (cuda backend only; 89-real covers the RTX 4090)"
        required: false
        default: "75-virtual;80-real;86-real;89-real;90-virtual"
      trellis_webp:
        description: "Encode GLB textures as WebP (EXT_texture_webp); OFF exports PNG"
        required: true
        type: choice
        default: "ON"
        options:
          - "ON"
          - "OFF"
      build_parallel:
        description: "Parallel build jobs"
        required: false
        default: "4"

permissions:
  contents: read

env:
  TRELLIS_REPO: SeasonRealms/trellis.cpp

jobs:
  build-windows-x64:
    runs-on: windows-2022
    # Windows CUDA builds of ggml + trellis across five architectures are long;
    # upstream also allows a generous budget for this leg.
    timeout-minutes: 300

    steps:
      - name: Checkout ${{ env.TRELLIS_REPO }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TRELLIS_REPO }}
          ref: ${{ github.event.inputs.trellis_ref }}
          path: trellis-src
          # Recursive: thirdparty/ggml is checked out at the commit pinned by the
          # trellis.cpp tree itself, which is the GGML version this build ships.
          submodules: recursive

      - name: Record pinned revisions
        shell: pwsh
        run: |
          $trellisCommit = (git -C trellis-src rev-parse HEAD).Trim()
          # season3d-src is checked out further down, so it cannot be rev-parsed
          # here; github.sha is exactly the commit that checkout resolves to.
          $season3dCommit = '${{ github.sha }}'
          $ggmlUrl = (git -C trellis-src config -f .gitmodules --get submodule.thirdparty/ggml.url).Trim()
          $ggmlStatus = git -C trellis-src submodule status thirdparty/ggml
          # " f8697b3... thirdparty/ggml (heads/trellis)" -> SHA
          $ggmlCommit = (($ggmlStatus -replace '^\s*[+\-U]?', '') -split '\s+')[0]

          "TRELLIS_COMMIT=$trellisCommit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SEASON3D_COMMIT=$season3dCommit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GGML_URL=$ggmlUrl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GGML_COMMIT=$ggmlCommit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          @(
            "trellis.cpp: $trellisCommit"
            "season3d:    $season3dCommit (C ABI shim)"
            "ggml:        $ggmlCommit ($ggmlUrl)"
          ) | ForEach-Object {
            Write-Host $_
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $_
          }

      - name: Checkout Season3D (C ABI shim source)
        uses: actions/checkout@v4
        with:
          # The shim lives in this repository; trellis-src above is the other
          # checkout. Both have to exist before CMake runs.
          path: season3d-src

      - name: Add the C ABI lane to the trellis build
        shell: pwsh
        run: |
          # The copy and the CMake append live in the repository rather than here,
          # so a local build runs the very same step:
          #   native/apply-capi-lane.ps1 -TrellisSource <path to a trellis.cpp checkout>
          # See that script for why the lane has to be compiled by trellis.cpp's own
          # CMake project and next to src/trellis_cli.cpp + src/trellis_args.cpp.
          & season3d-src/native/apply-capi-lane.ps1 -TrellisSource trellis-src

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install CUDA Toolkit
        if: github.event.inputs.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "${{ github.event.inputs.cuda_version }}"

      - name: Configure CMake
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-S', 'trellis-src',
            '-B', 'build',
            '-G', 'Ninja',
            "-DCMAKE_BUILD_TYPE=${{ github.event.inputs.configuration }}",
            # GGML_NATIVE=OFF keeps the CPU path off the runner's own ISA so the
            # binaries stay portable; GGML_OPENMP=OFF drops the libomp runtime
            # dependency (mirrors upstream's Windows packaging).
            '-DGGML_NATIVE=OFF',
            '-DGGML_OPENMP=OFF',
            # The build model is part of the packaging contract and is therefore
            # pinned instead of left to the ggml default: BUILD_SHARED_LIBS=ON
            # makes ggml produce DLLs, which trellis.cpp's CMakeLists.txt
            # colocates with the executables (CMAKE_RUNTIME_OUTPUT_DIRECTORY) and
            # which the Package step must ship. GGML_BACKEND_DL stays OFF because
            # trellis.cpp walks ggml_backend_reg_count(): that registry only lists
            # backends linked into the binary, so dynamic backend modules would be
            # invisible to it - and their names would drift into
            # ggml-cpu-<variant>.dll variants.
            '-DBUILD_SHARED_LIBS=ON',
            '-DGGML_BACKEND_DL=OFF',
            "-DTRELLIS_WEBP=${{ github.event.inputs.trellis_webp }}"
          )

          if ('${{ github.event.inputs.backend }}' -eq 'cuda') {
            $cmakeArgs += '-DGGML_CUDA=ON'
            $cmakeArgs += "-DCMAKE_CUDA_ARCHITECTURES=${{ github.event.inputs.cuda_architectures }}"
          }

          Write-Host "Running: cmake $($cmakeArgs -join ' ')"
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build trellis-cli, trellis-server and the C ABI lane
        shell: pwsh
        run: |
          # season_trellis is the dll target appended by the step above; it compiles
          # trellis_capi.cpp plus the two sources trellis_run()/parse_args() live in.
          & cmake --build build --target trellis-cli trellis-server season_trellis --parallel "${{ github.event.inputs.build_parallel }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          $out = "out/runtimes/win-x64/native"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item build/trellis-cli.exe $out -Force
          Copy-Item build/trellis-server.exe $out -Force

          # The C ABI lane. Same trellis_core, same ggml, one exported entry; the
          # name is fixed by OUTPUT_NAME trellis so consumers bind to "trellis" on
          # every platform (trellis.dll / libtrellis.so / libtrellis.a).
          $capiDll = Get-ChildItem build -Recurse -File -Filter 'trellis.dll' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $capiDll) {
            throw "trellis.dll was not produced - the season_trellis target is missing from the build"
          }
          Copy-Item $capiDll.FullName $out -Force

          Copy-Item trellis-src/LICENSE -Destination (Join-Path $out "trellis.txt") -Force
          Copy-Item trellis-src/thirdparty/ggml/LICENSE -Destination (Join-Path $out "ggml.txt") -Force

          # ggml is a shared build, and Windows resolves imports only from the
          # directory of the loading .exe, so the whole ggml runtime has to sit
          # next to trellis-cli.exe / trellis-server.exe. Copy every ggml*.dll the
          # build emitted (the set depends on the backend) and then fail loudly
          # when a mandatory piece is absent, instead of shipping a package that
          # cannot even start.
          Get-ChildItem build -Recurse -File -Filter 'ggml*.dll' -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName $out -Force }

          $requiredGgmlDlls = @('ggml.dll', 'ggml-base.dll')
          if ('${{ github.event.inputs.backend }}' -eq 'cuda') {
            $requiredGgmlDlls += 'ggml-cuda.dll'
          }

          foreach ($name in $requiredGgmlDlls) {
            if (-not (Test-Path (Join-Path $out $name))) {
              throw "Required GGML runtime is missing: $name (BUILD_SHARED_LIBS must stay ON)"
            }
          }

          if ('${{ github.event.inputs.backend }}' -eq 'cuda') {
            # The CUDA runtime is not part of the binary: ship cudart/cublas next
            # to the executables. CUDA 13 moved the Windows DLLs into bin/x64, so
            # search the toolkit recursively and fail loudly when a DLL is absent.
            $cudaRoot = $env:CUDA_PATH
            if (-not $cudaRoot) { throw "CUDA_PATH is not set" }

            foreach ($pattern in @('cudart64_*.dll', 'cublas64_*.dll', 'cublasLt64_*.dll')) {
              $dll = Get-ChildItem -Path $cudaRoot -Recurse -File -Filter $pattern -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if (-not $dll) { throw "$pattern not found under $cudaRoot" }
              Write-Host "Bundling $($dll.Name)"
              Copy-Item $dll.FullName $out -Force
            }
          }

          $manifest = @(
            "trellis.cpp : $env:TRELLIS_COMMIT"
            "season3d    : $env:SEASON3D_COMMIT (C ABI shim + apply-capi-lane.ps1)"
            "ggml        : $env:GGML_COMMIT ($env:GGML_URL)"
            "backend     : ${{ github.event.inputs.backend }}"
            "configuration: ${{ github.event.inputs.configuration }}"
            "webp        : ${{ github.event.inputs.trellis_webp }}"
            "GGML_NATIVE : OFF"
            "GGML_OPENMP : OFF"
            "ggml linkage: shared (BUILD_SHARED_LIBS=ON, GGML_BACKEND_DL=OFF, GGML_MAX_NAME=128)"
            "api lane    : thin C ABI - trellis.dll exports trellis_run_argv/trellis_api_version"
            "              (parse_args+trellis_run, the same pair trellis-cli.exe runs)"
          )

          if ('${{ github.event.inputs.backend }}' -eq 'cuda') {
            $manifest += "cuda        : ${{ github.event.inputs.cuda_version }} (${{ github.event.inputs.cuda_architectures }})"
          }

          $manifest += ""
          $manifest += "Artifact contents:"
          $manifest += (Get-ChildItem $out -File | Sort-Object Name | ForEach-Object { $_.Name })
          $manifest += "README.txt"

          $manifest | Set-Content -Path (Join-Path $out "README.txt") -Encoding utf8
          $manifest | ForEach-Object { Write-Host $_ }

      - name: Verify C ABI lane exports
        shell: pwsh
        run: |
          # "The build succeeded" does not prove the dll is callable: a missing
          # __declspec(dllexport) still yields a valid DLL with nothing to bind to,
          # which only surfaces in a consumer as EntryPointNotFoundException. Read
          # the export table with dumpbin instead of loading the image, so the check
          # works on a runner that has no GPU driver to start the dll at all.
          $dll = 'out/runtimes/win-x64/native/trellis.dll'
          if (-not (Test-Path $dll)) { throw "trellis.dll is missing from the package" }

          $exports = (& dumpbin /nologo /exports $dll 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "dumpbin /exports failed on $dll" }

          # extern "C" keeps these unmangled, so plain name matching is enough.
          foreach ($symbol in @('trellis_run_argv', 'trellis_api_version')) {
            if ($exports -notmatch "\b$symbol\b") {
              throw "trellis.dll does not export $symbol - the C ABI lane degraded to a plain dll"
            }
          }

          $exports -split "`n" |
            Where-Object { $_ -match 'trellis_run_argv|trellis_api_version' } |
            ForEach-Object { Write-Host "export: $($_.Trim())" }

      - name: Verify runtime dependencies
        shell: pwsh
        run: |
          # 0xC0000135 is raised for a missing import at *any* depth, and the
          # loader gives up before main(). A level-1 check therefore proves
          # nothing: trellis-cli.exe only imports ggml.dll / cudart64_12.dll, while
          # the dependency that actually broke the first run sat two levels down
          # (ggml.dll -> ggml-cuda.dll -> nvcuda.dll). Walk the whole closure and
          # classify every node:
          #   package - shipped here, recurse into it
          #   host    - System32 (OS, VC redist), i.e. the target machine has it
          #   driver  - the NVIDIA driver API: not shippable, absent on a GPU-less
          #             runner, so it cannot gate the build either
          #   missing - would fail on every machine: fail the job
          $out = "out/runtimes/win-x64/native"
          $driverProvided = @('nvcuda.dll', 'nvcuda64.dll', 'nvml.dll', 'nvapi64.dll')

          function Get-Imports {
            param([string]$Path)
            # 2>&1: GitHub's pwsh wrapper runs with $ErrorActionPreference=Stop,
            # where a native stderr write would abort the step.
            $dump = (& dumpbin /nologo /dependents $Path 2>&1) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /dependents failed on $Path" }
            [regex]::Matches($dump, '(?m)^\s+([A-Za-z0-9_.\-]+\.dll)\s*$') |
              ForEach-Object { $_.Groups[1].Value } |
              # api-ms-win-* / ext-ms-* are API-set contracts, not files: the
              # loader maps them through the API Set Schema onto ucrtbase.dll and
              # friends, so Test-Path can never find them.
              Where-Object { $_ -notmatch '^(api-ms-win|ext-ms)-' } |
              Sort-Object -Unique
          }

          $resolved = @{}
          $queue = [System.Collections.Generic.Queue[string]]::new()
          # Both lanes, because they are separate images with their own import
          # tables: the dll is loaded by an application process, so a dependency
          # missing from its closure fails just as hard as for the exe.
          foreach ($name in @('trellis-cli.exe', 'trellis-server.exe', 'trellis.dll')) {
            $queue.Enqueue((Join-Path $out $name))
          }

          while ($queue.Count -gt 0) {
            $binary = $queue.Dequeue()
            foreach ($dll in (Get-Imports $binary)) {
              if ($resolved.ContainsKey($dll)) { continue }
              $packaged = Join-Path $out $dll
              if (Test-Path $packaged) {
                $resolved[$dll] = 'package'
                $queue.Enqueue($packaged)
              }
              elseif (Test-Path (Join-Path $env:SystemRoot "System32\$dll")) {
                $resolved[$dll] = 'host'
              }
              elseif ($driverProvided -contains $dll.ToLowerInvariant()) {
                $resolved[$dll] = 'driver'
              }
              else {
                $resolved[$dll] = 'missing'
              }
            }
          }

          $report = $resolved.Keys | Sort-Object { $resolved[$_] }, { $_ } |
            ForEach-Object { '{0,-28} {1}' -f $_, $resolved[$_] }
          $report | Set-Content -Path (Join-Path $out "dependencies.txt") -Encoding utf8
          Add-Content -Path (Join-Path $out "README.txt") -Value "dependencies.txt" -Encoding utf8
          $report | ForEach-Object { Write-Host $_ }

          $missing = @($resolved.Keys | Where-Object { $resolved[$_] -eq 'missing' } | Sort-Object)
          $driverless = @($resolved.Keys | Where-Object { $resolved[$_] -eq 'driver' } | Sort-Object)
          Write-Host ("import closure: {0} DLLs - package {1}, host {2}, driver-only {3}, missing {4}" -f (
            $resolved.Count),
            @($resolved.Keys | Where-Object { $resolved[$_] -eq 'package' }).Count,
            @($resolved.Keys | Where-Object { $resolved[$_] -eq 'host' }).Count,
            $driverless.Count,
            $missing.Count)

          if ($missing.Count -gt 0) {
            throw "Runtime dependencies missing from the package: $($missing -join ', ')"
          }
          if ($driverless.Count -gt 0) {
            Write-Host "Host-only dependencies, provided by the target machine's GPU driver: $($driverless -join ', ')"
          }

      - name: Smoke test packaged trellis-cli
        shell: pwsh
        run: |
          # The cuda build imports nvcuda.dll through ggml-cuda.dll, so the process
          # cannot even be created on a host without an NVIDIA driver - which is
          # every GitHub-hosted Windows runner. That is a property of the host, not
          # of the package, and nothing can be bundled to fix it, so the dynamic
          # check is conditional. The import closure above is what gates the
          # artifact on CI; this step proves the packaged layout loads for real
          # whenever a driver exists (self-hosted runner, developer machine).
          if ('${{ github.event.inputs.backend }}' -eq 'cuda' -and
              -not (Test-Path (Join-Path $env:SystemRoot "System32\nvcuda.dll"))) {
            $msg = "Dynamic smoke test skipped: this runner has no NVIDIA driver (System32/nvcuda.dll is absent) and a cuda build cannot be loaded without one. The import closure check passed; run trellis-cli.exe --help on a machine with a driver."
            Write-Host "::warning::$msg"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $msg" -Encoding utf8
            return
          }

          # --help prints its usage to stderr, and GitHub's pwsh wrapper enables
          # $ErrorActionPreference=Stop, which turns a native stderr write into a
          # terminating error. Merge the streams and judge the process by its exit
          # code alone.
          $ErrorActionPreference = 'Continue'
          $usage = & "out/runtimes/win-x64/native/trellis-cli.exe" --help 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $usage

          if ($code -ne 0) {
            $hint = switch ($code) {
              -1073741515 { '0xC0000135 STATUS_DLL_NOT_FOUND - a DLL in the import closure is missing' }
              -1073741511 { '0xC0000139 STATUS_ENTRYPOINT_NOT_FOUND - a DLL was found but does not export what the exe needs (ABI-mismatched ggml)' }
              -1073741701 { '0xC000007B STATUS_INVALID_IMAGE_FORMAT - 32/64-bit mix-up or a corrupted DLL' }
              default      { 'no known mapping; see dependencies.txt in the artifact' }
            }
            throw "trellis-cli.exe --help failed with exit code $code ($hint)"
          }

          Write-Host 'trellis-cli.exe --help exited 0: the packaged layout loads.'

          # trellis.dll imports the same closure as this exe (trellis_core is
          # static in both), so a layout that starts the exe starts the dll too.
          # Its export table is asserted in 'Verify C ABI lane exports' rather than
          # by loading it here, because loading it would need the same GPU driver.

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        # Runs even when a step above fails: a failing package is exactly the one
        # worth downloading (it reproduces 0xC0000135 locally in seconds), and a
        # red run with no downloadable artifact helps nobody.
        if: always()
        with:
          name: trellis-win-x64-${{ github.event.inputs.backend }}-${{ github.event.inputs.configuration }}
          path: out/runtimes/win-x64/native/
          if-no-files-found: error
