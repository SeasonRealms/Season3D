name: build-trellis.yml

# Builds SeasonRealms/trellis.cpp for Windows x64 against SeasonRealms/ggml, the
# same ggml the rest of the product ships (SeasonGGML builds it from the same
# repository). trellis.cpp still declares pwilkin/ggml as its submodule, so that
# checkout is deliberately not used: the submodule is left out and a
# SeasonRealms/ggml tree is vendored into thirdparty/ggml instead, which is the
# path trellis.cpp's own CMakeLists.txt consumes (GGML_DIR +
# add_subdirectory(thirdparty/ggml)). The commit trellis.cpp pins in its gitlink
# is still read out and printed next to the one actually built, so drift between
# the two lineages shows up in the job summary instead of going unnoticed.
# Freezing the build = passing a commit/tag in trellis_ref. ggml_ref defaults to
# SeasonRealms/ggml `master`, the branch every package in the product builds from,
# and it is not pinned to a tag: because that branch moves, the commits the two
# checkouts actually resolved to are printed, written to the artifact manifest and
# recorded in the job summary. The manifest is what makes a later rebuild
# reproducible - not the ref name.
# An artifact is therefore the triple (resolved trellis commit, resolved ggml
# commit, this repository's commit): the one source file this repository
# contributes - the C ABI shim - is taken from the checkout of the commit that
# triggered the run, and that commit is recorded next to the trellis and ggml ones.
#
# SeasonThreeD ships two entry points into the same code, and the package carries
# both:
#
#   trellis-cli.exe / trellis-server.exe - the worker lane. trellis_core is linked
#     statically into them, and the ggml they run on IS packaged here: this build
#     compiles SeasonRealms/ggml anyway (trellis.cpp's CMake consumes it through
#     add_subdirectory), so the runtime it produced - ggml.dll, ggml-base.dll,
#     ggml-cpu-<variant>.dll, ggml-cuda.dll, ggml-vulkan.dll - is collected into the
#     artifact instead of being produced by a second SeasonGGML run. That is only
#     sound because the options are SeasonGGML's options (GGML_BACKEND_DL=ON,
#     GGML_CPU_ALL_VARIANTS=ON, GGML_MAX_NAME=128): whichever package a given module
#     is taken from, it is the same module. The CUDA redistributables stay out -
#     cudart / cublas / cublasLt are several hundred MB and come from
#     cudacudnn-runtime, which SeasonStudio stages next to every AI package.
#
#   trellis.dll - the thin C ABI lane. trellis.cpp exposes no C header and its
#     core is STATIC, so this is our own single export: trellis_run_argv(), the
#     same parse_args()+trellis_run() pair the cli runs, compiled by a target
#     appended to trellis.cpp's own CMake project (see native/trellis_capi.cpp in
#     this repository; native/apply-capi-lane.ps1 is the script that copies it in
#     and appends the target, and a local build runs the same script). It is what
#     lets SeasonThreeD present one library-shaped API on every platform - a dll here,
#     .so/.dylib/.a elsewhere - while the worker stays available for crash
#     isolation and hard timeouts.
#
# Two pins are part of that contract and have to match the rest of the product:
#
#   ggml_ref       - must resolve to the same ggml the other packages were built
#                    from. ggml.dll, ggml-base.dll and the backend modules all pass
#                    ggml_tensor and the backend vtables across the boundary, so a
#                    revision skew surfaces as STATUS_ENTRYPOINT_NOT_FOUND or as
#                    silent corruption. It defaults to SeasonRealms/ggml `master`,
#                    which carries upstream 0.27.0 plus the patches trellis.cpp's
#                    results depend on (fastdiv UB above 2^31, GGML_PREC_F32 honoured
#                    in the TILE / VEC / MMA FlashAttention kernels, and the
#                    GGML_FA_DEBUG dispatch line). Plain upstream 0.27 compiles and
#                    links, then returns a different latent: res-1024 dense scenes
#                    take a GPU page fault in fastdiv and the FA bias goes 13x
#                    (NVIDIA MMA) or ~120 sigma (AMD TILE) out - so point this at a
#                    tree that has those patches, and at the tree the other four
#                    packages use.
#   cuda_version   - must be the toolkit cudacudnn-runtime ships (12.8.1): both
#                    ggml-cuda.dll and trellis's own kernels (deform_conv,
#                    decimate_qem) link cudart64_12.dll.
#
# The artifact is therefore (trellis_ref, ggml_ref, cuda_version, this repository's
# commit) - all four are printed into the summary and the manifest.
#
# The worker lane ships TWICE, because trellis's two custom GPU kernels (BiRefNet's
# deformable conv and the QEM decimator) are compiled against exactly one GPU API:
#
#   trellis-cli.exe / trellis-server.exe        - the CUDA lane (GGML_CUDA=ON); the
#     fastest one on NVIDIA, where both kernels are native CUDA against the cudart
#     cudacudnn-runtime already provides. src/trellis_model.cpp refuses every device
#     whose registry name is not "CUDA" here, because the CPU deform_conv fallback is
#     minutes per run.
#   trellis-cli-vulkan.exe / trellis-server-vulkan.exe
#                                               - the Vulkan lane (GGML_VULKAN=ON, no
#     CUDA at all); both kernels are SPIR-V compute shaders, so one binary covers
#     NVIDIA, AMD and Intel through ggml-vulkan.dll and still falls back to
#     ggml-cpu-<variant>.dll when no Vulkan device is usable. The workflow installs
#     the Vulkan SDK so glslc is always there; on a runner without it the lane is
#     built without ggml-vulkan and keeps the CPU deform fallback (an explicit
#     vulkan_kernels=off does the same on purpose).
#   trellis.dll / trellis-vulkan.dll            - the same two lanes as C ABI dlls.
#
# Splitting by lane instead of by vendor is deliberate: a CUDA build links cudart64_12
# into its own kernels and never compiles the Vulkan shaders, so one binary cannot do
# both - it would either drag cudart onto AMD/Intel machines or leave deform_conv on the
# CPU. The managed lane picks the worker per machine (TrellisWorker.Auto: nvcuda.dll
# present -> CUDA worker, else Vulkan worker) and both are addressable explicitly.
#
# One consequence worth knowing when reading a run: this artifact ships ggml-cuda.dll
# and ggml-vulkan.dll in the same folder (SeasonGGML's does too), so a Vulkan worker
# left to itself would pick the CUDA device on an NVIDIA machine - right for ggml,
# wrong for trellis, whose kernels in that build are SPIR-V. SeasonThreeD therefore
# passes --backend Vulkan for that lane and retries once on --backend CPU when the
# backend will not initialize, which is what keeps the CPU fallback the worker would
# otherwise do on its own. Neither lane relies on anything from this workflow beyond
# the files being named as they are.


on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "CMake build type"
        required: true
        type: choice
        default: "Release"
        options:
          - Release
          - Debug
      trellis_ref:
        description: "SeasonRealms/trellis.cpp tag / branch / commit (a commit or tag freezes the build)"
        required: true
        default: "main"
      ggml_ref:
        description: "SeasonRealms/ggml tag / branch / commit (must resolve to the ggml the other packages build; the resolved commit is recorded)"
        required: true
        # SeasonRealms/ggml's master, not a tag: this workflow compiles that tree
        # itself and ships the resulting ggml*.dll, so the product no longer needs a
        # separate SeasonGGML run to get its runtime. Because the branch moves, the
        # commit it resolved to is printed into the summary, the manifest and
        # dependencies.txt; that commit - not this default - is what reproduces a
        # build. Pass a commit here to freeze one anyway.
        default: "master"
      vulkan_kernels:
        description: "Vulkan lane: compile the SPIR-V deform_conv/decimate kernels (needs the Vulkan SDK's glslc)"
        required: true
        type: choice
        default: "auto"
        options:
          - auto
          - "on"
          - "off"
      cuda_version:
        description: "CUDA Toolkit version (CUDA lane), aligned with SeasonGGML / SeasonTTS"
        required: false
        default: "12.8.1"
      cuda_architectures:
        description: "CUDA architectures (CUDA lane only; 89-real covers the RTX 4090)"
        required: false
        default: "75-virtual;80-real;86-real;89-real;90-virtual"
      trellis_webp:
        description: "Encode GLB textures as WebP (EXT_texture_webp); OFF exports PNG"
        required: true
        type: choice
        default: "ON"
        options:
          - "ON"
          - "OFF"
      build_parallel:
        description: "Parallel build jobs"
        required: false
        default: "4"

permissions:
  contents: read

env:
  TRELLIS_REPO: SeasonRealms/trellis.cpp
  GGML_REPO: SeasonRealms/ggml

jobs:
  build-windows-x64:
    runs-on: windows-2022
    # Windows CUDA builds of ggml + trellis across five architectures are long;
    # upstream also allows a generous budget for this leg.
    timeout-minutes: 300

    steps:
      - name: Checkout ${{ env.TRELLIS_REPO }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TRELLIS_REPO }}
          ref: ${{ github.event.inputs.trellis_ref }}
          path: trellis-src
          # No submodules on purpose. thirdparty/ggml is trellis.cpp's only
          # submodule and it points at pwilkin/ggml; the ggml tree this build
          # actually compiles is SeasonRealms/ggml, vendored into that exact path
          # by the next two steps. Downloading the other lineage first would only
          # cost minutes and then be deleted.
          submodules: false

      - name: Checkout ${{ env.GGML_REPO }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GGML_REPO }}
          ref: ${{ github.event.inputs.ggml_ref }}
          # Sibling of trellis-src, not nested inside it: the tree is copied over
          # thirdparty/ggml below, and a nested checkout would leave a second
          # repository inside a submodule path.
          path: ggml-src
          # ggml carries no submodules, so this is a no-op today and stays false
          # to keep the checkout cheap.
          submodules: false

      - name: Vendor ${{ env.GGML_REPO }} into thirdparty/ggml
        shell: pwsh
        run: |
          # trellis.cpp hardcodes the ggml path:
          #   set(GGML_DIR ${CMAKE_SOURCE_DIR}/thirdparty/ggml)
          #   add_subdirectory(thirdparty/ggml)
          # There is no cache variable to redirect it, so swapping the source
          # means materialising the tree at that path - exactly what a submodule
          # checkout would have produced, minus the pwilkin/ggml commit.
          $dst = 'trellis-src/thirdparty/ggml'
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          # .git is checkout metadata, nothing else is: dotfiles (.gitignore,
          # .clang-format, CMake's own manifests) belong to the tree.
          Get-ChildItem -LiteralPath 'ggml-src' -Force |
            Where-Object { $_.Name -ne '.git' } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $dst -Recurse -Force }

          # Fail here rather than inside CMake's add_subdirectory: a wrong ref or
          # an empty tree otherwise surfaces as an unrelated configure error.
          foreach ($required in @('CMakeLists.txt', 'include/ggml.h', 'include/ggml-backend.h', 'LICENSE')) {
            if (-not (Test-Path (Join-Path $dst $required))) {
              throw "$env:GGML_REPO@${{ github.event.inputs.ggml_ref }} has no $required - that checkout is not a ggml tree"
            }
          }

          # The vendored tree no longer matches the gitlink trellis.cpp records,
          # so git would report thirdparty/ggml as modified and trellis.cpp's
          # CMakeLists.txt would stamp TRELLIS_GIT_DIRTY=1 into every binary.
          # The substitution is intended, so hide it from status instead of
          # shipping "-dirty" builds.
          git -C trellis-src config submodule.thirdparty/ggml.ignore all
          if ($LASTEXITCODE -ne 0) { throw "could not suppress submodule dirtiness in trellis-src" }

          Write-Host "Vendored $env:GGML_REPO@${{ github.event.inputs.ggml_ref }} into $dst"

      - name: Record pinned revisions
        shell: pwsh
        env:
          GGML_REF: ${{ github.event.inputs.ggml_ref }}
        run: |
          $trellisCommit = (git -C trellis-src rev-parse HEAD).Trim()
          # seasonthreed-src is checked out further down, so it cannot be rev-parsed
          # here; github.sha is exactly the commit that checkout resolves to.
          $seasonthreedCommit = '${{ github.sha }}'
          # The tree that was vendored above, not the commit trellis.cpp records:
          # the two lineages have diverged, so both are reported.
          $ggmlCommit = (git -C ggml-src rev-parse HEAD).Trim()
          $ggmlPinned = ((git -C trellis-src ls-tree HEAD thirdparty/ggml) -split '\s+')[2]
          $ggmlUrl = "https://github.com/$env:GGML_REPO"

          "TRELLIS_COMMIT=$trellisCommit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SEASONTHREED_COMMIT=$seasonthreedCommit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GGML_URL=$ggmlUrl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GGML_COMMIT=$ggmlCommit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GGML_REF=$env:GGML_REF" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GGML_PINNED=$ggmlPinned" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          @(
            "trellis.cpp  : $trellisCommit"
            "SeasonThreeD : $seasonthreedCommit (C ABI shim)"
            "ggml         : $ggmlCommit ($ggmlUrl @ $env:GGML_REF)"
          ) | ForEach-Object {
            Write-Host $_
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $_ -Encoding utf8
          }

          # trellis.cpp still records pwilkin/ggml@f8697b33 as its gitlink, while the
          # tree this build vendors comes from ggml_ref. That substitution is the
          # design, not drift: SeasonRealms/ggml master already carries the
          # FlashAttention-precision and fastdiv patches trellis.cpp's results depend
          # on, and it is the ref SeasonGGML / SeasonLLM / SeasonImage / SeasonTTS
          # build too, which is what keeps ggml_tensor one ABI across the product.
          # Reported as a plain line so the run log still names both commits, without
          # claiming a regression the artifact does not have.
          if ($ggmlPinned -ne $ggmlCommit) {
            $note = "ggml vendored at $ggmlCommit ($env:GGML_REF) replaces the pwilkin/ggml commit trellis.cpp records ($ggmlPinned); intended - master carries that branch's FA-precision and fastdiv patches and is the ref the other packages build from."
            Write-Host $note
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $note" -Encoding utf8
          }

      - name: Checkout SeasonThreeD (C ABI shim source)
        uses: actions/checkout@v4
        with:
          # The shim lives in this repository; trellis-src above is the other
          # checkout. Both have to exist before CMake runs.
          path: seasonthreed-src

      - name: Add the C ABI lane to the trellis build
        shell: pwsh
        run: |
          # The copy and the CMake append live in the repository rather than here,
          # so a local build runs the very same step:
          #   native/apply-capi-lane.ps1 -TrellisSource <path to a trellis.cpp checkout>
          # See that script for why the lane has to be compiled by trellis.cpp's own
          # CMake project and next to src/trellis_cli.cpp + src/trellis_args.cpp.
          & seasonthreed-src/native/apply-capi-lane.ps1 -TrellisSource trellis-src

      # ggml's backend entry points are not in ggml.dll: with GGML_BACKEND_DL=ON
      # ggml-cpu / ggml-cuda / ggml-vulkan are MODULE libraries that ggml only
      # add_dependencies() on, so there is no import library and
      # ggml_backend_cpu_init() & co. cannot be linked. A source that calls one of
      # them fails as C3861 (trellis.cpp deliberately does not include ggml-cpu.h)
      # or, if someone "fixes" that by adding the include, as LNK2019 at the very
      # end of the build. Both outcomes are how this lane last broke; the point of
      # this step is to make the next occurrence fail in seconds instead of after a
      # full CUDA compile.
      #
      # The symbol set is read out of ggml's own headers rather than listed here, so
      # a ggml bump that adds an entry point extends the guard automatically. What a
      # backend may be reached through instead is the registry: the helpers in
      # include/trellis_sched.h (ggml_backend_dev_by_type + ggml_backend_dev_init,
      # ggml_backend_get_device / ggml_backend_dev_type) and
      # ggml_backend_reg_get_proc_address() for the backend-private functions.
      #
      # Legal shapes are filtered out rather than reported: a symbol named only as a
      # string for get_proc_address(), a symbol named only inside decltype() to
      # recover its signature, symbols behind // comments, and thirdparty/ (the ggml
      # tree itself). --untracked is what makes src/trellis_capi.cpp visible - the C
      # ABI shim is copied in by the step above and exists only as an untracked file.
      - name: Check sources stay on the backend registry API
        shell: pwsh
        run: |
          $src     = 'trellis-src'
          $ggmlInc = 'trellis-src/thirdparty/ggml/include'
          $exempt  = @()
          $skip    = @('thirdparty')

          # Entry point = the identifier right before '(' on a GGML_BACKEND_API line.
          $syms = foreach ($h in 'ggml-cpu.h', 'ggml-cuda.h', 'ggml-vulkan.h', 'ggml-metal.h') {
            foreach ($line in Get-Content -LiteralPath (Join-Path $ggmlInc $h) -ErrorAction SilentlyContinue) {
              if ($line -match 'GGML_BACKEND_API\s+.*?([A-Za-z_]\w*)\s*\(') { $matches[1] }
            }
          }
          $syms = @($syms | Sort-Object -Unique | Where-Object { $exempt -notcontains $_ })
          # Fail closed: a silently empty set would leave this step green forever.
          if ($syms.Count -lt 60) {
            throw "read only $($syms.Count) backend entry points from $ggmlInc - ggml's headers changed shape and the guard cannot be trusted"
          }

          $word     = '(?<![A-Za-z0-9_])(?:' + ($syms -join '|') + ')(?![A-Za-z0-9_])'
          $pathspec = @('.') + ($skip | ForEach-Object { ":(exclude)$_" })
          $raw      = git -C $src grep --untracked -n -I -w -E ($syms -join '|') -- @pathspec
          if ($LASTEXITCODE -gt 1) { throw "git grep failed with $LASTEXITCODE" }

          $bad = foreach ($hit in $raw) {
            $file, $line, $text = $hit -split ':', 3
            if ($text -match 'get_proc_address|decltype') { continue }
            $code = $text -replace '"[^"]*"', '""' -replace '//.*$', '' -replace '/\*[^*]*\*/', ''
            if ($code -notmatch $word) { continue }
            "${file}:${line}: $($code.Trim())"
          }

          if ($bad) {
            $bad | ForEach-Object { Write-Host $_ }
            throw "$($bad.Count) backend-module symbol(s) referenced directly - use the registry API described above"
          }
          Write-Host "no backend entry point is referenced outside comments and registry lookups ($($syms.Count) checked)"
          exit 0

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "${{ github.event.inputs.cuda_version }}"

      - name: Install Vulkan SDK
        # Installed, not probed: the image has no Vulkan SDK, so "auto" used to
        # resolve to false on every run and the Vulkan lane shipped with the CPU
        # implementations of deform_conv / decimate_qem - a lane that exists for
        # AMD and Intel and then runs minutes per attempt. SeasonGGML installs the
        # same action for ggml-vulkan; this lane needs it just as much.
        uses: jakoch/install-vulkan-sdk-action@v1

      - name: Detect the Vulkan SDK
        id: vulkan
        shell: pwsh
        run: |
          # The Vulkan lane builds deform_conv.comp and decimate_qem.comp into SPIR-V
          # with glslc, which only ships in the Vulkan SDK. "auto" means: use it when
          # this runner has it; without it the lane still builds and runs, only with
          # the CPU implementations of both kernels - correct, but minutes per run.
          # That fallback is for runners without the SDK, not for the product: the
          # step above installs it, and 'vulkan_kernels=off' remains the only way to
          # ask for the CPU lane on purpose.
          $choice = '${{ github.event.inputs.vulkan_kernels }}'
          $glslc = Get-Command glslc -ErrorAction SilentlyContinue
          $enable = switch ($choice) {
            'on'   { if (-not $glslc) { throw "vulkan_kernels=on, but glslc is not on PATH - install the Vulkan SDK on this runner" }; $true }
            'off'  { $false }
            default {
              if (-not $glslc) {
                # Loud, because the resulting package looks complete: the lane
                # starts, picks ggml-vulkan, and every run then falls back to the
                # CPU kernels.
                Write-Host "::warning::vulkan_kernels=auto found no glslc after installing the Vulkan SDK - the Vulkan lane ships with the CPU deform_conv/decimate fallback"
              }
              [bool]$glslc
            }
          }

          # FindVulkan() keys off VULKAN_SDK, and a runner that only has glslc on PATH
          # (e.g. picked up from a driver bundle) would otherwise fail the configure.
          if ($enable -and -not $env:VULKAN_SDK -and $glslc) {
            $sdk = Split-Path (Split-Path $glslc.Source -Parent) -Parent   # <sdk>/Bin/glslc.exe
            $env:VULKAN_SDK = $sdk
            Write-Host "VULKAN_SDK derived from glslc: $sdk"
            "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          Write-Host "vulkan_kernels=$choice glslc=$([bool]$glslc) -> ggml-vulkan=$enable"
          "enabled=$($enable.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure CMake (CUDA lane + Vulkan lane)
        shell: pwsh
        run: |
          # One source tree, two configurations - one per shipped worker:
          #
          #   build-cuda   -> trellis-cli.exe / trellis-server.exe / trellis.dll
          #                   (GGML_CUDA=ON: deform_conv + decimate are CUDA kernels)
          #   build-vulkan -> trellis-cli-vulkan.exe / trellis-server-vulkan.exe /
          #                   trellis-vulkan.dll (no CUDA; both kernels as SPIR-V when
          #                   ggml-vulkan is on, CPU fallback otherwise)
          #
          # Everything else is shared, so it is spelled once.
          $common = @(
            '-S', 'trellis-src',
            '-G', 'Ninja',
            "-DCMAKE_BUILD_TYPE=${{ github.event.inputs.configuration }}",
            # GGML_NATIVE=OFF keeps the CPU path off the runner's own ISA so the
            # binaries stay portable; GGML_OPENMP=OFF drops the libomp runtime
            # dependency (mirrors upstream's Windows packaging).
            '-DGGML_NATIVE=OFF',
            '-DGGML_OPENMP=OFF',
            # The build model is part of the packaging contract and is therefore
            # pinned instead of left to the ggml default:
            #   BUILD_SHARED_LIBS=ON - ggml is a DLL, not a static archive.
            #   GGML_BACKEND_DL=ON   - every backend is a module that ggml.dll loads at
            #     run time, exactly as SeasonGGML builds it. trellis.cpp reaches them
            #     through the registry API only (ggml_backend_load_all +
            #     ggml_backend_dev_by_type / dev_init), so it links nothing but
            #     ggml + ggml-base - which is what lets both packages run on ONE ggml
            #     runtime instead of shipping two.
            # The backend modules are still compiled (ggml's CMake makes ggml depend on
            # them) and are now packaged (see Package): ggml.dll, ggml-base.dll, the
            # ggml-cpu-<variant>.dll set, ggml-cuda.dll and ggml-vulkan.dll ship with
            # the workers so no separate SeasonGGML run is needed. cudart / cublas /
            # cublasLt are still excluded - they come from cudacudnn-runtime.
            '-DBUILD_SHARED_LIBS=ON',
            '-DGGML_BACKEND_DL=ON',
            # Same CPU module layout as SeasonGGML / SeasonImage / SeasonTTS
            # (GGML_CPU_ALL_VARIANTS=ON): ggml-cpu.dll becomes the dispatcher and the
            # per-ISA implementations sit next to it. Drop this and the set this
            # artifact ships would differ from SeasonGGML's, so a folder holding
            # copies from both would dispatch on whichever arrived first.
            '-DGGML_CPU_ALL_VARIANTS=ON',
            "-DTRELLIS_WEBP=${{ github.event.inputs.trellis_webp }}"
          )

          $cudaArgs = $common + @(
            '-B', 'build-cuda',
            '-DGGML_CUDA=ON',
            "-DCMAKE_CUDA_ARCHITECTURES=${{ github.event.inputs.cuda_architectures }}"
          )
          Write-Host "Running: cmake $($cudaArgs -join ' ')"
          & cmake @cudaArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $vulkanArgs = $common + @('-B', 'build-vulkan')
          if ('${{ steps.vulkan.outputs.enabled }}' -eq 'true') {
            # TARGET ggml-vulkan then exists, which is what makes trellis.cpp compile
            # deform_conv_vk.cpp / decimate_qem_vk.cpp instead of the CPU fallbacks.
            $vulkanArgs += '-DGGML_VULKAN=ON'
          }
          Write-Host "Running: cmake $($vulkanArgs -join ' ')"
          & cmake @vulkanArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build both lanes
        shell: pwsh
        run: |
          # season_trellis is the dll target appended by 'Add the C ABI lane'; it
          # compiles trellis_capi.cpp plus the two sources trellis_run()/parse_args()
          # live in. trellis-devices is not packaged: it only enumerates ggml's
          # registry, which is how the verification step proves the DL backend modules
          # were discovered - once per lane, because the lanes link different kernels.
          foreach ($lane in @('cuda', 'vulkan')) {
            Write-Host "=== build-$lane ==="
            & cmake --build "build-$lane" --target trellis-cli trellis-server trellis-devices season_trellis --parallel "${{ github.event.inputs.build_parallel }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }


      - name: Package
        shell: pwsh
        run: |
          $out = "out/runtimes/win-x64/native"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # Two lanes, two names, one package. The CUDA lane keeps the plain names so a
          # caller that just asks for "trellis-cli" gets what it always got; the Vulkan
          # lane says so in its file names, because that is the copy an AMD or Intel
          # machine - or any machine without a usable CUDA device - is meant to run.
          function Copy-LaneFile {
            param([string]$Lane, [string]$Name, [string]$As)
            $src = Get-ChildItem "build-$Lane" -Recurse -File -Filter $Name -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $src) { throw "build-$Lane produced no $Name" }
            Copy-Item $src.FullName (Join-Path $out $As) -Force
            Write-Host "packaged build-$Lane/$Name -> $As"
          }

          # The C ABI lane. Same trellis_core, same ggml, one exported entry; the
          # name is fixed by OUTPUT_NAME trellis so consumers bind to "trellis" on
          # every platform (trellis.dll / libtrellis.so / libtrellis.a). The CUDA copy
          # imports cudart64_12 and is therefore only loadable where cudacudnn-runtime
          # is staged; trellis-vulkan.dll is the portable one, and both expose
          # trellis_run_argv so the choice is a file name, not an ABI.
          Copy-LaneFile cuda   'trellis-cli.exe'           'trellis-cli.exe'
          Copy-LaneFile cuda   'trellis-server.exe'        'trellis-server.exe'
          Copy-LaneFile cuda   'trellis.dll'               'trellis.dll'
          Copy-LaneFile vulkan 'trellis-cli.exe'           'trellis-cli-vulkan.exe'
          Copy-LaneFile vulkan 'trellis-server.exe'        'trellis-server-vulkan.exe'
          Copy-LaneFile vulkan 'trellis.dll'               'trellis-vulkan.dll'

          Copy-Item trellis-src/LICENSE -Destination (Join-Path $out "trellis.txt") -Force
          Copy-Item trellis-src/thirdparty/ggml/LICENSE -Destination (Join-Path $out "ggml.txt") -Force

          # The ggml runtime this build produced, packaged here. That is the point of
          # the whole arrangement: this workflow compiles the same SeasonRealms/ggml
          # tree a SeasonGGML run would, so its output is collected instead of being
          # rebuilt by a second run. Both lanes are merged because they differ in
          # exactly the one module each was configured for - ggml-cuda.dll exists only
          # in build-cuda, ggml-vulkan.dll only in build-vulkan when the SDK was found -
          # while ggml.dll / ggml-base.dll / ggml-cpu-<variant>.dll are identical in
          # both and simply collapse in the name-keyed table below.
          $ggmlModules = @{}
          foreach ($lane in @('cuda', 'vulkan')) {
            Get-ChildItem "build-$lane" -Recurse -File -Filter 'ggml*.dll' -ErrorAction SilentlyContinue |
              ForEach-Object { $ggmlModules[$_.Name] = $_.FullName }
          }
          foreach ($name in @('ggml.dll', 'ggml-base.dll')) {
            if (-not $ggmlModules.ContainsKey($name)) {
              throw "the build produced no $name - BUILD_SHARED_LIBS / GGML_BACKEND_DL changed?"
            }
          }
          if (-not $ggmlModules.ContainsKey('ggml-cuda.dll')) {
            throw 'the CUDA lane produced no ggml-cuda.dll - the packaged runtime would be CPU/Vulkan only'
          }
          foreach ($entry in $ggmlModules.GetEnumerator()) {
            Copy-Item $entry.Value (Join-Path $out $entry.Key) -Force
          }
          Write-Host ("ggml modules packaged: {0}" -f (($ggmlModules.Keys | Sort-Object) -join ', '))

          # The CUDA redistributables stay out: several hundred MB, not ggml's to ship,
          # and cudacudnn-runtime already stages exactly the version trellis linked
          # against. Asserted rather than assumed - a second cudart in the output folder
          # is the kind of drift that only surfaces as STATUS_ENTRYPOINT_NOT_FOUND on a
          # user's machine. The 'Verify runtime dependencies' step stages cudart /
          # cublas from the toolkit into verify/ and proves the closure resolves.
          $leaked = @(Get-ChildItem $out -File | Where-Object {
            $_.Name -match '^(cudart|cublas|cublasLt|nvrtc|cufft|curand|cusparse|nvJitLink)\d+_\d+\.dll$' -or
            $_.Name -like 'cudnn*.dll'
          })
          if ($leaked.Count -gt 0) {
            throw "SeasonThreeD must not package the CUDA runtime: $($leaked.Name -join ', ') - cudacudnn-runtime provides it."
          }

          $manifest = @(
            "trellis.cpp : $env:TRELLIS_COMMIT"
            "SeasonThreeD: $env:SEASONTHREED_COMMIT (C ABI shim + apply-capi-lane.ps1)"
            "ggml        : $env:GGML_COMMIT ($env:GGML_REPO @ $env:GGML_REF)"
            "ggml source : $env:GGML_URL - vendored into trellis.cpp thirdparty/ggml"
            "ggml pin    : $env:GGML_PINNED (gitlink recorded by trellis.cpp)"
            "lanes       : trellis-cli.exe / trellis-server.exe / trellis.dll = CUDA lane (GGML_CUDA=ON)"
            "              trellis-cli-vulkan.exe / trellis-server-vulkan.exe / trellis-vulkan.dll"
            "              = Vulkan lane (GGML_VULKAN=${{ steps.vulkan.outputs.enabled }}, no CUDA)"
            "              TrellisWorker.Auto runs the CUDA lane when nvcuda.dll is present, the"
            "              Vulkan lane otherwise; both fall back to ggml-cpu-<variant>.dll."
            "configuration: ${{ github.event.inputs.configuration }}"
            "webp        : ${{ github.event.inputs.trellis_webp }}"
            "GGML_NATIVE : OFF"
            "GGML_OPENMP : OFF"
            "ggml linkage: shared, GGML_BACKEND_DL=ON, GGML_CPU_ALL_VARIANTS=ON, GGML_MAX_NAME=128"
            "ggml runtime: PACKAGED HERE - ggml.dll / ggml-base.dll / ggml-cpu*.dll /"
            "              ggml-cuda.dll / ggml-vulkan.dll were compiled by this run from"
            "              $env:GGML_COMMIT and are interchangeable with the copies the other"
            "              AI packages ship (same ggml_ref, same options), so no separate"
            "              SeasonGGML build is required for this package to run"
            "cuda runtime: NOT PACKAGED - cudart / cublas / cublasLt come from"
            "              cudacudnn-runtime, which SeasonStudio stages next to the app"
            "api lane    : thin C ABI - trellis.dll exports trellis_run_argv/trellis_api_version"
            "              (parse_args+trellis_run, the same pair trellis-cli.exe runs)"
            "cuda        : ${{ github.event.inputs.cuda_version }} (${{ github.event.inputs.cuda_architectures }})"
          )

          $manifest += ""
          $manifest += "Artifact contents:"
          $manifest += (Get-ChildItem $out -File | Sort-Object Name | ForEach-Object { $_.Name })
          $manifest += "README.txt"

          $manifest | Set-Content -Path (Join-Path $out "README.txt") -Encoding utf8
          $manifest | ForEach-Object { Write-Host $_ }

      - name: Verify C ABI lane exports
        shell: pwsh
        run: |
          # "The build succeeded" does not prove the dll is callable: a missing
          # __declspec(dllexport) still yields a valid DLL with nothing to bind to,
          # which only surfaces in a consumer as EntryPointNotFoundException. Read
          # the export table with dumpbin instead of loading the image, so the check
          # works on a runner that has no GPU driver to start the dll at all.
          # Both lanes are asserted: the Vulkan dll is a separate image with its own
          # table, and it is the copy an AMD/Intel machine loads.
          foreach ($leaf in @('trellis.dll', 'trellis-vulkan.dll')) {
            $dll = "out/runtimes/win-x64/native/$leaf"
            if (-not (Test-Path $dll)) { throw "$leaf is missing from the package" }

            $exports = (& dumpbin /nologo /exports $dll 2>&1) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /exports failed on $dll" }

            # extern "C" keeps these unmangled, so plain name matching is enough.
            foreach ($symbol in @('trellis_run_argv', 'trellis_api_version')) {
              if ($exports -notmatch "\b$symbol\b") {
                throw "$leaf does not export $symbol - the C ABI lane degraded to a plain dll"
              }
            }

            $exports -split "`n" |
              Where-Object { $_ -match 'trellis_run_argv|trellis_api_version' } |
              ForEach-Object { Write-Host "$leaf export: $($_.Trim())" }
          }

      - name: Verify runtime dependencies
        shell: pwsh
        run: |
          # 0xC0000135 is raised for a missing import at *any* depth, and the
          # loader gives up before main(). A level-1 check therefore proves
          # nothing: trellis-cli.exe only imports ggml.dll / cudart64_12.dll, while
          # the dependency that actually broke the first run sat two levels down
          # (ggml.dll -> ggml-cuda.dll -> nvcuda.dll). Walk the whole closure and
          # classify every node:
          #   package - present in the staged folder, recurse into it
          #   host    - System32 (OS, VC redist), i.e. the target machine has it
          #   driver  - the NVIDIA driver API: not shippable, absent on a GPU-less
          #             runner, so it cannot gate the build either
          #   missing - would fail on every machine: fail the job
          $out = "out/runtimes/win-x64/native"

          # The package now carries the ggml runtime it compiled, but still no CUDA
          # runtime: an application gets cudart / cublas / cublasLt from
          # cudacudnn-runtime, which SeasonStudio stages into the same output folder.
          # Reproduce that layout instead of testing a package that would only be
          # complete in isolation: this package (workers + ggml modules) + the
          # toolkit's cudart / cublas / cublasLt.
          $verify = "verify/win-x64"
          Remove-Item $verify -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $verify | Out-Null
          Copy-Item (Join-Path $out '*') $verify -Recurse -Force

          # The ggml modules travel with the package now - Package copied the union of
          # both lanes into $out, so the wildcard copy above already staged them, and
          # both lanes' workers resolve against that one folder. Assert what the
          # closure cannot do without; ggml-vulkan.dll is deliberately not required
          # here, because a run with vulkan_kernels=off ships none and still has to
          # verify.
          foreach ($name in @('ggml.dll', 'ggml-base.dll', 'ggml-cuda.dll')) {
            if (-not (Test-Path (Join-Path $verify $name))) {
              throw "$name is missing from the staged package - BUILD_SHARED_LIBS / GGML_BACKEND_DL / Package changed?"
            }
          }

          # Verification-only probe, never packaged: enumerating the registry is the
          # only way to see whether the DL modules next to ggml.dll were found at all.
          # One per lane, because they link different kernels.
          foreach ($lane in @('cuda', 'vulkan')) {
            $devicesExe = Get-ChildItem "build-$lane" -Recurse -File -Filter 'trellis-devices.exe' -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $devicesExe) { throw "build-$lane has no trellis-devices.exe - it is missing from the --target list" }
            Copy-Item $devicesExe.FullName (Join-Path $verify "trellis-devices-$lane.exe") -Force
          }

          # Same version the build linked against, i.e. what cudacudnn-runtime ships.
          # The CUDA lane is always built now, so this is unconditional.
          $cudaRoot = $env:CUDA_PATH
          if (-not $cudaRoot) { throw "CUDA_PATH is not set" }
          foreach ($pattern in @('cudart64_*.dll', 'cublas64_*.dll', 'cublasLt64_*.dll')) {
            $dll = Get-ChildItem -Path $cudaRoot -Recurse -File -Filter $pattern -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $dll) { throw "$pattern not found under $cudaRoot" }
            Write-Host "Staging $($dll.Name) for verification"
            Copy-Item $dll.FullName $verify -Force
          }

          # Both the NVIDIA driver API and the Vulkan loader are the target machine's
          # business: neither is shippable, and a GPU-less runner has neither, so
          # classifying them as driver-provided is what keeps this gate about the
          # package instead of about the runner.
          $driverProvided = @('nvcuda.dll', 'nvcuda64.dll', 'nvml.dll', 'nvapi64.dll', 'vulkan-1.dll')

          function Get-Imports {
            param([string]$Path)
            # 2>&1: GitHub's pwsh wrapper runs with $ErrorActionPreference=Stop,
            # where a native stderr write would abort the step.
            $dump = (& dumpbin /nologo /dependents $Path 2>&1) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /dependents failed on $Path" }
            [regex]::Matches($dump, '(?m)^\s+([A-Za-z0-9_.\-]+\.dll)\s*$') |
              ForEach-Object { $_.Groups[1].Value } |
              # api-ms-win-* / ext-ms-* are API-set contracts, not files: the
              # loader maps them through the API Set Schema onto ucrtbase.dll and
              # friends, so Test-Path can never find them.
              Where-Object { $_ -notmatch '^(api-ms-win|ext-ms)-' } |
              Sort-Object -Unique
          }

          $resolved = @{}
          $queue = [System.Collections.Generic.Queue[string]]::new()
          # Every image in the package, because each has its own import table: the
          # dlls are loaded by an application process, and the two lanes link different
          # GPU runtimes, so a dependency missing from either closure fails just as hard
          # as for the exe it belongs to.
          foreach ($name in @('trellis-cli.exe', 'trellis-server.exe', 'trellis.dll',
                              'trellis-cli-vulkan.exe', 'trellis-server-vulkan.exe', 'trellis-vulkan.dll')) {
            $queue.Enqueue((Join-Path $verify $name))
          }

          while ($queue.Count -gt 0) {
            $binary = $queue.Dequeue()
            foreach ($dll in (Get-Imports $binary)) {
              if ($resolved.ContainsKey($dll)) { continue }
              $packaged = Join-Path $verify $dll
              if (Test-Path $packaged) {
                $resolved[$dll] = 'package'
                $queue.Enqueue($packaged)
              }
              elseif (Test-Path (Join-Path $env:SystemRoot "System32\$dll")) {
                $resolved[$dll] = 'host'
              }
              elseif ($driverProvided -contains $dll.ToLowerInvariant()) {
                $resolved[$dll] = 'driver'
              }
              else {
                $resolved[$dll] = 'missing'
              }
            }
          }

          $report = $resolved.Keys | Sort-Object { $resolved[$_] }, { $_ } |
            ForEach-Object { '{0,-28} {1}' -f $_, $resolved[$_] }
          $report | Set-Content -Path (Join-Path $out "dependencies.txt") -Encoding utf8
          Add-Content -Path (Join-Path $out "README.txt") -Value "dependencies.txt" -Encoding utf8
          $report | ForEach-Object { Write-Host $_ }

          $missing = @($resolved.Keys | Where-Object { $resolved[$_] -eq 'missing' } | Sort-Object)
          $driverless = @($resolved.Keys | Where-Object { $resolved[$_] -eq 'driver' } | Sort-Object)
          Write-Host ("import closure: {0} DLLs - package {1}, host {2}, driver-only {3}, missing {4}" -f (
            $resolved.Count),
            @($resolved.Keys | Where-Object { $resolved[$_] -eq 'package' }).Count,
            @($resolved.Keys | Where-Object { $resolved[$_] -eq 'host' }).Count,
            $driverless.Count,
            $missing.Count)

          if ($missing.Count -gt 0) {
            throw "Runtime dependencies missing from the package: $($missing -join ', ')"
          }
          if ($driverless.Count -gt 0) {
            Write-Host "Host-only dependencies, provided by the target machine's GPU driver: $($driverless -join ', ')"
          }

      - name: Smoke test the staged layout
        shell: pwsh
        run: |
          # Runs against verify/win-x64 - this package plus the ggml modules and the
          # CUDA runtime an application would have next to it. With
          # GGML_BACKEND_DL=ON a missing NVIDIA driver no longer stops the process:
          # ggml-cuda.dll simply fails to load, no CUDA device is registered, and
          # trellis falls back to CPU. So unlike the old DL=OFF package - where
          # ggml.dll hard-imported ggml-cuda.dll and every GPU-less runner had to skip
          # this step - the dynamic check now runs everywhere, including CI.
          $ErrorActionPreference = 'Continue'
          $verify = "verify/win-x64"

          $hint = @{
            -1073741515 = '0xC0000135 STATUS_DLL_NOT_FOUND - a DLL in the import closure is missing'
            -1073741511 = '0xC0000139 STATUS_ENTRYPOINT_NOT_FOUND - a DLL was found but does not export what the exe needs (ABI-mismatched ggml)'
            -1073741701 = '0xC000007B STATUS_INVALID_IMAGE_FORMAT - 32/64-bit mix-up or a corrupted DLL'
          }

          # --help prints its usage to stderr, and GitHub's pwsh wrapper enables
          # $ErrorActionPreference=Stop, which turns a native stderr write into a
          # terminating error. Merge the streams and judge the process by its exit
          # code alone.
          function Invoke-WorkerHelp {
            param([string]$Exe, [string]$Label)
            $usage = & (Join-Path $verify $Exe) --help 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host "--- $Label ($Exe) ---"
            Write-Host $usage
            return $code
          }

          $cudaCode = Invoke-WorkerHelp 'trellis-cli.exe' 'CUDA lane'
          if ($cudaCode -ne 0) {
            $why = if ($hint.ContainsKey($cudaCode)) { $hint[$cudaCode] } else { 'no known mapping; see dependencies.txt in the artifact' }
            throw "trellis-cli.exe --help failed with exit code $cudaCode ($why)"
          }
          Write-Host 'trellis-cli.exe --help exited 0: the CUDA lane loads.'

          # The Vulkan lane's only shippable-adjacent dependency is the Vulkan loader,
          # which comes with the graphics driver. A runner without one cannot start the
          # exe at all, and that says nothing about the package - so the same rule the
          # CUDA device check uses applies here: absent driver, skipped, not failed.
          $vulkanLoadable = Test-Path (Join-Path $env:SystemRoot "System32\vulkan-1.dll")
          $vulkanCode = Invoke-WorkerHelp 'trellis-cli-vulkan.exe' 'Vulkan lane'
          if ($vulkanCode -ne 0) {
            if ($vulkanCode -eq -1073741515 -and -not $vulkanLoadable) {
              Write-Host 'trellis-cli-vulkan.exe cannot start on this runner: no vulkan-1.dll in System32, i.e. no Vulkan loader. Expected on a GPU-less runner, not shippable.'
            } else {
              $why = if ($hint.ContainsKey($vulkanCode)) { $hint[$vulkanCode] } else { 'no known mapping; see dependencies.txt in the artifact' }
              throw "trellis-cli-vulkan.exe --help failed with exit code $vulkanCode ($why)"
            }
          } else {
            Write-Host 'trellis-cli-vulkan.exe --help exited 0: the Vulkan lane loads.'
          }

          # The one failure mode this build model can introduce: a DL=ON ggml whose
          # registry stays empty because no backend module sits next to it. Then every
          # ggml_backend_dev_init() fails and trellis has no CPU fallback at all - it
          # would still pass --help, so it needs its own assertion. Checked per lane:
          # both workers link the same tree but different kernels.
          foreach ($lane in @('cuda', 'vulkan')) {
            $devicesExe = Join-Path $verify "trellis-devices-$lane.exe"
            $devices = & $devicesExe 2>&1 | Out-String
            $devicesCode = $LASTEXITCODE
            Write-Host "--- trellis-devices-$lane ---"
            Write-Host $devices
            if ($devicesCode -ne 0) { throw "trellis-devices-$lane.exe failed with exit code $devicesCode" }

            if ($devices -notmatch '(?m)^\s*\[\d+\]\s+CPU\s+devices:\s*[1-9]') {
              throw "ggml's registry has no CPU backend ($lane lane): GGML_BACKEND_DL=ON found no ggml-cpu module next to the exe. trellis would have no device to run on."
            }

            # A GPU is the runner's business, the backend module is ours: when the
            # driver is there, the corresponding module must have registered devices.
            if ($lane -eq 'cuda') {
              if ($devices -match '(?m)^\s*\[\d+\]\s+CUDA\s+devices:\s*[1-9]') {
                Write-Host 'CUDA backend registered with at least one device.'
              } elseif (-not (Test-Path (Join-Path $env:SystemRoot "System32\nvcuda.dll"))) {
                Write-Host 'CUDA backend not registered: this runner has no NVIDIA driver, which is expected and not shippable.'
              } else {
                throw "a CUDA build found no CUDA device although nvcuda.dll is present - ggml-cuda.dll is missing from the layout, failed to load, or its CUDA arch list omits this GPU"
              }
            } elseif ('${{ steps.vulkan.outputs.enabled }}' -ne 'true') {
              # The lane was configured without ggml-vulkan (vulkan_kernels=off, or the
              # runner has no Vulkan SDK). No module exists to register a device, and the
              # two custom kernels keep their CPU implementations - correct, just slow.
              Write-Host 'Vulkan backend not registered: this lane was built without ggml-vulkan, so deform_conv/decimate_qem stay on the CPU.'
            } elseif ($vulkanLoadable) {
              if ($devices -match '(?m)^\s*\[\d+\]\s+Vulkan\s+devices:\s*[1-9]') {
                Write-Host 'Vulkan backend registered with at least one device.'
              } else {
                throw "the Vulkan lane found no Vulkan device although vulkan-1.dll is present - ggml-vulkan.dll is missing from the layout or failed to load"
              }
            } else {
              Write-Host 'Vulkan backend not registered: this runner has no Vulkan loader, which is expected and not shippable.'
            }
          }

          # The dlls import the same closure as the exes (trellis_core is static in
          # both), so a layout that starts an exe starts its dll too. Their export
          # tables are asserted in 'Verify C ABI lane exports' rather than by loading
          # them here.

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        # Runs even when a step above fails: a failing package is exactly the one
        # worth downloading (it reproduces 0xC0000135 locally in seconds), and a
        # red run with no downloadable artifact helps nobody.
        if: always()
        with:
          name: trellis-win-x64-${{ github.event.inputs.configuration }}
          path: out/runtimes/win-x64/native/
          # warn, not error: out/ is created by Package, so a compile or link failure
          # upstream of it legitimately has nothing to upload. Failing this step too
          # would stack a second red on top of the error that actually stopped the run,
          # which is exactly the noise that made the first DL=ON failure hard to read.
          if-no-files-found: warn
